# 目录与默认参数
#
# 这个文件是给“不想碰代码”的人准备的：想换文件夹名字，改这里就行。
# 以 # 开头的行是说明，不用管。

# 你的原始视频放这个文件夹（手机拍的、相机拍的都行，不用改名字）
material_dir=素材

# 想模仿的那条抖音视频放这里，文件名必须是 reference.mp4
reference_dir=参考视频

# 每次生成的成片自动存到这里，按 v01、v02 编号，永不覆盖
output_dir=成片

# 中间文件，不用打开，也不要删（删了要重新算十几分钟）
work_dir=过程文件

# 画幅：
#   source = 跟你的素材一样，一帧不裁（推荐，先这样用）
#   9:16   = 竖屏铺满，会裁掉两边
#   3:4    = 参考片常用比例
canvas=source

# 成片高度（像素）。1440 适合抖音，1080 文件更小
height=1440

# 帧率
fps=30


# ─────────────────────────────────────────────
# 机器适配：这台是 MacBook Air M3 / 24GB，无风扇
# 下面这组参数是速度和质量折中的结果，不用改
# ─────────────────────────────────────────────

# 每段素材保留几个候选片段。少一点更快，但可选画面也少
segments_per_clip=6

# 配音线程数。8 核里留 2 核给系统，避免整机卡住
tts_threads=6

# 快模式：0 = 完整分析（质量好，慢）；1 = 跳过画面描述（快约四分之一，匹配稍弱）
fast_analysis=0
